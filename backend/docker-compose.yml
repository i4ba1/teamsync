version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: teamsync
      POSTGRES_PASSWORD: teamsync_password
      POSTGRES_DB: teamsync_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://teamsync:teamsync_password@db:5432/teamsync_development
      REDIS_URL: redis://redis:6379/0
      PASETO_SECRET_KEY: ${PASETO_SECRET_KEY:-your-secret-key-here-at-least-32-bytes-long}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - bundle_cache:/bundle
    stdin_open: true
    tty: true

  sidekiq:
    build: .
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://teamsync:teamsync_password@db:5432/teamsync_development
      REDIS_URL: redis://redis:6379/0
      PASETO_SECRET_KEY: ${PASETO_SECRET_KEY:-your-secret-key-here-at-least-32-bytes-long}
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - bundle_cache:/bundle

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
